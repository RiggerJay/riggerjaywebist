<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RiggerJay Photography</title>
    <meta
      name="description"
      content="Photography galleries for RiggerJay, featuring portrait, travel, and everyday storytelling collections."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <div class="brand" aria-label="RiggerJay Photography home">
          <span class="brand-mark">RJ</span>
          <span>RiggerJay</span>
        </div>
        <nav class="nav-links" aria-label="Main navigation">
          <a href="#gallery" class="link-text">Galleries</a>
          <a href="https://www.instagram.com/riggerjay_photo/" target="_blank" rel="noreferrer" aria-label="Instagram" class="social-link">
            <img src="https://www.instagram.com/favicon.ico" alt="" aria-hidden="true" />
            <span>Instagram</span>
          </a>
          <a href="https://bsky.app/profile/riggerjay.bsky.social" target="_blank" rel="noreferrer" aria-label="Bluesky" class="social-link">
            <img src="https://bsky.app/favicon.ico" alt="" aria-hidden="true" />
            <span>Bluesky</span>
          </a>
          <a href="https://fetlife.com/RiggerJay" target="_blank" rel="noreferrer" aria-label="FetLife" class="social-link">
            <img src="https://fetlife.com/favicon.ico" alt="" aria-hidden="true" />
            <span>FetLife</span>
          </a>
          <a href="https://www.reddit.com/user/rj_photo/" target="_blank" rel="noreferrer" aria-label="Reddit" class="social-link">
            <img src="https://www.reddit.com/favicon.ico" alt="" aria-hidden="true" />
            <span>Reddit</span>
          </a>
        </nav>
      </div>
    </header>

    <main class="page-shell">
      <section class="hero">
        <div class="container hero-inner">
          <div class="hero-copy">
            <p class="eyebrow">Photography</p>
            <h1>RiggerJay</h1>
            <p class="intro">
              Portraits, moments, and everyday scenes from the road.
            </p>
          </div>
          <div class="hero-card">
            <div id="featuredGrid" class="mini-grid" aria-live="polite"></div>
          </div>
        </div>
      </section>

      <section id="gallery" class="gallery-section">
        <div class="container">
          <div class="section-heading">
            <p class="eyebrow">Collections</p>
            <h2>Recent galleries</h2>
          </div>
          <div id="galleryGrid" class="gallery-grid" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <template id="galleryCardTemplate">
      <article class="gallery-card">
        <div class="image-wrap">
          <img src="" alt="" loading="lazy" />
        </div>
        <div class="card-body">
          <h3></h3>
          <p class="meta"></p>
        </div>
      </article>
    </template>

    <dialog id="imageDialog" class="image-dialog" aria-label="Full-size image preview">
      <div class="dialog-panel">
        <button id="closeDialog" class="dialog-close" type="button" aria-label="Close image preview">×</button>
        <img id="dialogImage" src="" alt="Full-size gallery image" />
      </div>
    </dialog>

    <script src="/app.js"></script>
  </body>
</html>
